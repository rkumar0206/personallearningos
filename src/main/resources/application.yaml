management:
  endpoints:
    web:
      exposure:
        # Expose health and info endpoints (or use '*' for all endpoints)
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      # Shows detailed health indicators (helpful during development)
      show-details: always
      # Explicitly enable Kubernetes Liveness & Readiness probe endpoints
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true